<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-User Tiffin & Expense Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-slate-100 text-slate-800 font-sans min-h-screen">

    <!-- Auth View -->
    <div id="auth-view" class="container mx-auto px-4 h-screen flex items-center justify-center">
        <div class="bg-white p-8 rounded-lg shadow-md w-full max-w-md">
            <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Tiffin Tracker Login</h1>
            <form id="auth-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium mb-1">Email</label>
                    <input type="email" id="email"
                        class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div>
                    <label class="block text-sm font-medium mb-1">Password</label>
                    <input type="password" id="password"
                        class="w-full p-2 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                </div>
                <div class="flex gap-4">
                    <button type="submit" id="sign-in-btn"
                        class="flex-1 bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition">Sign In</button>
                    <button type="button" id="sign-up-btn"
                        class="flex-1 bg-slate-200 text-slate-700 py-2 rounded hover:bg-slate-300 transition">Sign
                        Up</button>
                </div>
            </form>
            <p id="auth-error" class="text-red-500 text-sm mt-4 text-center hidden"></p>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="hidden">
        <!-- Header -->
        <header class="bg-white shadow-sm p-4 mb-6">
            <div class="container mx-auto flex justify-between items-center">
                <h1 class="text-xl font-bold text-blue-600">Daily Tracker</h1>
                <div class="flex items-center gap-4">
                    <span id="user-email" class="text-sm text-slate-500 hidden sm:inline"></span>
                    <button id="logout-btn" class="text-sm text-red-500 hover:text-red-700">Logout</button>
                </div>
            </div>
        </header>

        <main class="container mx-auto px-4 space-y-6 pb-20">
            <!-- Quick Log Section -->
            <section class="bg-white p-6 rounded-lg shadow-sm">
                <h2 class="text-lg font-semibold mb-4">Add Daily Log</h2>
                <form id="log-form" class="grid grid-cols-1 sm:grid-cols-4 gap-4 items-end">
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Date</label>
                        <input type="date" id="log-date" class="w-full p-2 border rounded" required>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Item</label>
                        <select id="log-product" class="w-full p-2 border rounded" required>
                            <option value="" disabled selected>Select Product</option>
                            <!-- Options populated via JS -->
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-500 mb-1">Quantity</label>
                        <input type="number" id="log-quantity" step="0.5" value="1" class="w-full p-2 border rounded"
                            required>
                    </div>
                    <button type="submit"
                        class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700 transition h-[42px]">Add
                        Entry</button>
                </form>
            </section>

            <!-- Monthly Report & History -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- Summary Card -->
                <div
                    class="bg-blue-50 p-6 rounded-lg border border-blue-100 flex flex-col justify-center items-center text-center">
                    <h3 class="text-sm text-blue-800 font-medium mb-2">Total Bill for Period</h3>
                    <div class="text-3xl font-bold text-blue-700" id="total-bill">₹0</div>

                    <div class="flex gap-2 mt-4 w-full">
                        <div class="flex-1">
                            <label class="block text-xs text-blue-800 mb-1 text-left">From</label>
                            <input type="date" id="report-start" class="w-full p-1 text-sm bg-white border rounded">
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs text-blue-800 mb-1 text-left">To</label>
                            <input type="date" id="report-end" class="w-full p-1 text-sm bg-white border rounded">
                        </div>
                    </div>
                </div>

                <!-- Calendar View -->
                <div class="md:col-span-2 bg-white rounded-lg shadow-sm overflow-hidden">
                    <div class="p-4 border-b flex justify-between items-center">
                        <button id="prev-month-btn" class="p-2 hover:bg-slate-100 rounded-lg transition">
                            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M15 19l-7-7 7-7" />
                            </svg>
                        </button>
                        <h2 id="calendar-month-title" class="text-lg font-semibold text-slate-700">February 2026</h2>
                        <button id="next-month-btn" class="p-2 hover:bg-slate-100 rounded-lg transition">
                            <svg class="w-5 h-5 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M9 5l7 7-7 7" />
                            </svg>
                        </button>
                    </div>
                    <div class="calendar-container p-4">
                        <!-- Days Header -->
                        <div class="calendar-header grid grid-cols-7 gap-1 mb-2">
                            <div class="calendar-day-name text-center text-xs font-semibold text-slate-500 py-2">Sun
                            </div>
                            <div class="calendar-day-name text-center text-xs font-semibold text-slate-500 py-2">Mon
                            </div>
                            <div class="calendar-day-name text-center text-xs font-semibold text-slate-500 py-2">Tue
                            </div>
                            <div class="calendar-day-name text-center text-xs font-semibold text-slate-500 py-2">Wed
                            </div>
                            <div class="calendar-day-name text-center text-xs font-semibold text-slate-500 py-2">Thu
                            </div>
                            <div class="calendar-day-name text-center text-xs font-semibold text-slate-500 py-2">Fri
                            </div>
                            <div class="calendar-day-name text-center text-xs font-semibold text-slate-500 py-2">Sat
                            </div>
                        </div>
                        <!-- Calendar Grid -->
                        <div id="calendar-grid" class="grid grid-cols-7 gap-1">
                            <!-- Calendar cells populated via JS -->
                        </div>
                    </div>
                </div>
            </section>

            <!-- Manage Products (Collapsible/Modal-like for simplicity inline here) -->
            <section class="bg-white p-6 rounded-lg shadow-sm">
                <h2 class="text-lg font-semibold mb-4">Manage Items</h2>
                <form id="product-form" class="flex gap-4 items-end">
                    <div class="flex-1">
                        <input type="text" id="new-product-name" placeholder="Item Name (e.g. Milk)"
                            class="w-full p-2 border rounded" required>
                    </div>
                    <div class="w-24">
                        <input type="number" id="new-product-price" placeholder="Price"
                            class="w-full p-2 border rounded" required>
                    </div>
                    <button type="submit"
                        class="bg-slate-800 text-white py-2 px-4 rounded hover:bg-slate-900 transition">Add
                        Item</button>
                </form>
                <div id="products-list" class="mt-4 flex flex-wrap gap-2">
                    <!-- Product tags populated via JS -->
                </div>
            </section>
        </main>
    </div>

    <!-- Day Details Modal -->
    <div id="day-modal" class="modal-overlay hidden">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modal-date-title" class="text-lg font-semibold text-slate-700"></h3>
                <button id="modal-close-btn" class="text-slate-400 hover:text-slate-600 text-2xl">&times;</button>
            </div>
            <div id="modal-items-list" class="modal-body">
                <!-- Items populated via JS -->
            </div>

            <!-- Add Item Form inside Modal -->
            <div class="modal-add-section">
                <button id="modal-add-toggle-btn" class="modal-add-toggle" onclick="toggleModalAddForm()">
                    <span class="modal-add-icon">+</span> Add Item
                </button>
                <form id="modal-add-form" class="modal-add-form hidden" onsubmit="handleModalAddLog(event)">
                    <div class="modal-form-row">
                        <select id="modal-log-product" class="modal-form-input" required>
                            <option value="" disabled selected>Select Item</option>
                        </select>
                        <input type="number" id="modal-log-quantity" step="0.5" value="1" min="0.5"
                            class="modal-form-input modal-qty-input" placeholder="Qty" required>
                        <button type="submit" class="modal-form-submit">Add</button>
                    </div>
                </form>
            </div>

            <div id="modal-day-total" class="modal-footer"></div>
        </div>
    </div>

    <!-- Application Logic -->
    <script src="app.js"></script>
</body>

</html>
